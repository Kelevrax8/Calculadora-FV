services:
  web:
    build: .
    container_name: php_app
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    environment:
      TZ: America/Mexico_City
      PORT: 80
      AAD_TENANT_ID: ${AAD_TENANT_ID:-YOUR_TENANT_ID}
      AAD_CLIENT_ID: ${AAD_CLIENT_ID:-YOUR_CLIENT_ID}
      AAD_CLIENT_SECRET: ${AAD_CLIENT_SECRET:-YOUR_CLIENT_SECRET}
      AAD_REDIRECT_URI: ${AAD_REDIRECT_URI:-http://localhost:8080/}

  db:
    image: mysql:8.4.8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: secret
      TZ: America/Mexico_City
    volumes:
      - db_data:/var/lib/mysql
      - ./src/Schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data:

